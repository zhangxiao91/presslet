name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test and package
        run: ./scripts/package.sh
      - name: Upload Apple Silicon build
        uses: actions/upload-artifact@v4
        with:
          name: Presslet-macos-arm64
          path: dist/Presslet-*-macos-arm64.zip
          if-no-files-found: error
